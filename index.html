<body>
<div id="page">
  <div id="stage" aria-label="Candy Merge 2048">
    <canvas id="game"></canvas>

    <!-- ===== HUD ===== -->
    <div id="hud" hidden>
      <div class="topbar">
        <div class="tb-left">
          <button class="icon-btn c-blue" id="btn-records" aria-label="Records"><svg viewBox="0 0 24 24"><path d="M4 13h4v7H4zM10 4h4v16h-4zM16 9h4v11h-4z"/></svg></button>
          <button class="icon-btn c-teal" id="btn-collection" aria-label="Collection"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="7" cy="17" r="3.2"/><circle cx="17" cy="17" r="3.2"/></svg></button>
        </div>
        <div class="tb-center">
          <div class="score" id="score">0</div>
          <div class="pill best"><svg viewBox="0 0 24 24" class="crown"><path d="M3 18 2 7l5 4 5-7 5 7 5-4-1 11z"/><rect x="3" y="19" width="18" height="2.5" rx="1"/></svg><span id="best">0</span></div>
          <div class="pill gems"><img src="assets/gem.png" alt="" class="gem-ic"><span id="gems">0</span><button class="plus" id="btn-shop" aria-label="Gems"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" fill="none"/></svg></button></div>
        </div>
        <div class="tb-right">
          <button class="icon-btn c-pink" id="btn-share" aria-label="Share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8 15.7 6.3M8.3 13.2l7.4 4.5" stroke-width="2.2" stroke="currentColor" fill="none"/></svg></button>
          <button class="icon-btn c-green" id="btn-menu" aria-label="Menu"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="15.4" width="16" height="2.6" rx="1.3"/></svg></button>
        </div>
      </div>
      <div class="row2">
        <div class="items">
          <button class="item c-purple" id="btn-shake" aria-label="Shake">
            <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8M2 10v4M22 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            <span class="cost"><img src="assets/gem.png" alt=""><b id="shake-cost">30</b></span>
          </button>
          <button class="item c-orange" id="btn-remove" aria-label="Remove one">
            <svg viewBox="0 0 24 24"><path d="M9 21 6 15a1.6 1.6 0 0 1 2.8-1.4L10 15V5a1.5 1.5 0 0 1 3 0v6a1.4 1.4 0 0 1 2.6.6 1.4 1.4 0 0 1 2.6.8A1.4 1.4 0 0 1 20 14v3a4 4 0 0 1-4 4z"/></svg>
            <span class="cost"><img src="assets/gem.png" alt=""><b id="remove-cost">20</b></span>
          </button>
        </div>
        <div class="right-tools">
          <div class="tool">
            <button class="auto" id="btn-auto"><span id="auto-state">OFF</span></button>
            <label id="auto-label">AUTO</label>
          </div>
          <div class="tool next">
            <div class="next-circle"><img id="next-img" alt="" src=""></div>
            <label id="next-label">NEXT</label>
          </div>
        </div>
      </div>
      <div class="hint" id="hint" hidden><span id="hint-text"></span><button class="btn small c-red" id="hint-cancel">CANCEL</button></div>
      <div class="evobar" id="evobar"></div>
    </div>

    <!-- ===== TITLE ===== -->
    <div id="title" class="screen">
      <div class="title-card">
        <div class="logo-candies" id="logo-candies"></div>
        <h1 id="t-title">Candy Merge 2048</h1>
        <p id="t-tagline" class="tagline"></p>
        <button class="btn big c-pink" id="btn-play">PLAY</button>
        <div class="title-links">
          <button class="link" id="btn-howto">How to play</button>
          <button class="link" id="btn-lang"></button>
        </div>
        <div class="title-best" id="title-best"></div>
      </div>
      <a class="home-link" href="/" id="home-link">KOGAMES</a>
    </div>

    <!-- ===== POPUP ROOT ===== -->
    <div id="popups"></div>
    <div id="toast" hidden></div>
  </div>
  <noscript><p style="color:#fff;text-align:center;padding:2rem">Candy Merge 2048 needs JavaScript to run.</p></noscript>
</div>
<script src="game.js"></script>
